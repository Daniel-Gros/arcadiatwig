security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 
            algorithm: 'auto'
            cost: 15
    
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        

        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: app_logout
            entry_point: App\Security\UsersAuthenticator
                # where to redirect after logout
                # target: app_any_route

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/admin, roles: [ROLE_ADMIN, ROLE_EMPLOYEE, ROLE_VETERINAIRE] }
        - { path: ^/animal/crud, roles: [ROLE_ADMIN, ROLE_EMPLOYEE, ROLE_VETERINAIRE] }
        - { path: ^/animal/\d+/crud, roles: [ROLE_ADMIN, ROLE_EMPLOYEE, ROLE_VETERINAIRE] } # route fichier show
        - { path: ^/animal/crud/\d+/delete, roles: ROLE_ADMIN }
        - { path: ^/animal/crud/\d+/edit, roles: ROLE_ADMIN }
        - { path: ^/animal/crud/new, roles: ROLE_ADMIN }
        - { path: ^/habitat/crud, roles: ROLE_ADMIN }
        - { path: ^/habitat/\d+/crud, roles: ROLE_ADMIN } # route fichier show
        - { path: ^/habitat/crud/\d+/delete, roles: ROLE_ADMIN }
        - { path: ^/habitat/crud/\d+/edit, roles: ROLE_ADMIN }
        - { path: ^/habitat/new, roles: ROLE_ADMIN }
        - { path: ^/compte/rendu/veterinaire/crud, roles: [ROLE_ADMIN, ROLE_VETERINAIRE] }
        - { path: ^/compte/rendu/veterinaire/\d+/crud, roles: [ROLE_ADMIN, ROLE_VETERINAIRE] } # route fichier show
        - { path: ^/compte/rendu/veterinaire/\d+/crud/delete, roles: [ROLE_ADMIN, ROLE_VETERINAIRE] }
        - { path: ^/compte/rendu/veterinaire/crud/\d+/edit, roles: [ROLE_ADMIN, ROLE_VETERINAIRE] }
        - { path: ^/commentaire/habitat/crud, roles: ROLE_VETERINAIRE }
        - { path: ^/commentaire/habitat/\d+/crud, roles: ROLE_VETERINAIRE } # route fichier show
        - { path: ^/commentaire/habitat/crud/\d+/delete, roles: ROLE_VETERINAIRE }
        - { path: ^/commentaire/habitat/crud/\d+/edit, roles: ROLE_VETERINAIRE }        
        - { path: ^/service/crud, roles: [ROLE_ADMIN, ROLE_EMPLOYEE] }
        - { path: ^/service/\d+/crud, roles: [ROLE_ADMIN, ROLE_EMPLOYEE] } # route fichier show
        - { path: ^/service/crud/\d+/delete, roles: ROLE_ADMIN }
        - { path: ^/service/crud/\d+/edit, roles: [ROLE_ADMIN, ROLE_EMPLOYEE] }
        - { path: ^/service/crud/new, roles: [ROLE_ADMIN, ROLE_EMPLOYEE] }
        - { path: ^/user/crud, roles: ROLE_ADMIN }
        - { path: ^/user/crud/\d+, roles: ROLE_ADMIN } # route fichier show
        - { path: ^/user/crud/\d+/delete, roles: ROLE_ADMIN }
        - { path: ^/user/crud/\d+/edit, roles: ROLE_ADMIN }
        - { path: ^/user/crud/new, roles: ROLE_ADMIN }
        - { path: ^/horaires/crud, roles: ROLE_ADMIN }
        - { path: ^/horaires/crud/\d+, roles: ROLE_ADMIN } # route fichier show
        - { path: ^/horaires/crud/\d+/delete, roles: ROLE_ADMIN }
        - { path: ^/horaires/crud/\d+/edit, roles: ROLE_ADMIN }



when@test:
    security:
        providers:
            # used to reload user from session & other features (e.g. switch_user)
            app_user_provider:
                entity:
                    class: App\Entity\User
                    property: email
                
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
